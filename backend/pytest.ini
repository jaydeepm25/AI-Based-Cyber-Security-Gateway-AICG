[pytest]
pythonpath = .
testpaths = tests
markers =
    postgres_integration: Integration tests connecting to an isolated PostgreSQL test database (skipped by default, requires explicit opt-in and TEST_DATABASE_URL).
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore:.*InconsistentVersionWarning.*
    ignore:.*PytestCacheWarning.*
