version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    groups:
      per-dependency:
        group-by: dependency-name

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
